name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e  # v6.1.0

      # #2892 — install the Linux sandbox tools so the `linux_only` ProcessSandbox
      # tests run on the runner instead of assumeTrue-skipping (no bwrap = skip).
      # The runner is a native Ubuntu kernel, so bwrap works without a container.
      - name: Install Linux sandbox tools (bubblewrap / firejail)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap firejail

      - name: Build
        run: ./gradlew build -x test

      - name: Test
        run: ./gradlew test
