name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e  # v6.1.0

      # #2892 — install the Linux sandbox tools so the linux_only ProcessSandbox
      # tests run on the runner instead of assumeTrue-skipping (no bwrap = skip).
      - name: Install Linux sandbox tools (bubblewrap / firejail)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap firejail

      # ubuntu-latest (24.04) restricts unprivileged user namespaces via AppArmor,
      # which a non-setuid bwrap needs. Relax it so the confinement tests can
      # actually build a sandbox (otherwise they assumeTrue-skip).
      - name: Allow unprivileged user namespaces (bwrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: ./gradlew build -x test

      - name: Test
        run: ./gradlew tes
